<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoOn · Ride payment</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#172d3d;margin:0;padding:48px 20px}
    main{max-width:480px;margin:auto;background:white;padding:32px;border-radius:16px}
    h1{margin-top:0}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:8px;border:1px solid #b9c5ce}
    button{margin-top:16px;background:#125cda;color:white;border:0;cursor:pointer}
    button:disabled{opacity:.6}#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
    .secondary{background:#e8eef5;color:#172d3d}
  </style>
</head>
<body>
<main>
  <h1>Pay for your ride</h1>
  <p>Razorpay test checkout</p>
  <label for="ride">Ride ID</label><input id="ride" autocomplete="off">
  <label for="jwt">Customer access token</label><input id="jwt" type="password" autocomplete="off">
  <button id="pay" type="button">Open checkout</button>
  <button id="check" type="button" class="secondary">Check payment status</button>
  <p id="status" role="status" aria-live="polite">Enter your ride ID and customer token.</p>
</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const ride = document.getElementById('ride');
const jwt = document.getElementById('jwt');
const pay = document.getElementById('pay');
const status = document.getElementById('status');
let polling;
ride.value = new URLSearchParams(location.search).get('rideId') || '';
async function api(suffix = '', method = 'GET', body) {
  if (!/^[0-9a-f-]{36}$/i.test(ride.value.trim()) || !jwt.value.trim()) {
    throw new Error('Enter a ride UUID and customer access token.');
  }
  const response = await fetch('/payments/rides/' + encodeURIComponent(ride.value.trim()) + suffix, {
    method,
    headers: {'Authorization': 'Bearer ' + jwt.value.trim(), 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!response.ok) {
    throw new Error('Request failed (HTTP ' + response.status + '). Check authentication, ride ownership, and whether the final fare is ready.');
  }
  return response.json();
}
function show(result) {
  status.textContent = 'Payment: ' + result.status + '\nAmount: ' +
    (result.amountMinor / 100).toFixed(2) + ' ' + result.currency;
  if (result.status === 'PAID') clearInterval(polling);
}
async function check() {
  try { show(await api()); } catch (error) { status.textContent = error.message; }
}
function waitForCapture() {
  clearInterval(polling);
  let attempts = 0;
  polling = setInterval(() => {
    if (++attempts > 60) { clearInterval(polling); return; }
    check();
  }, 2000);
}
document.getElementById('check').onclick = check;
pay.onclick = async () => {
  pay.disabled = true;
  try {
    const checkout = await api('/checkout', 'POST');
    show(checkout);
    if (checkout.status === 'PAID') return;
    if (!checkout.keyId.startsWith('rzp_test_')) throw new Error('Test-mode key required.');
    const razorpay = new Razorpay({
      key: checkout.keyId, amount: checkout.amountMinor, currency: checkout.currency,
      order_id: checkout.orderId, name: 'GoOn', description: 'Ride payment',
      handler: async result => {
        try {
          const verified = await api('/verify', 'POST', result);
          show(verified);
          if (verified.status !== 'PAID') waitForCapture();
        } catch (error) {
          status.textContent = error.message + ' Payment confirmation may still arrive by webhook.';
          waitForCapture();
        }
      },
      modal: {ondismiss: () => { status.textContent = 'Checkout closed. You can retry or check payment status.'; }}
    });
    razorpay.on('payment.failed', () => {
      status.textContent = 'Payment attempt failed. You can retry checkout.';
      waitForCapture();
    });
    razorpay.open();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    pay.disabled = false;
  }
};
</script>
</body>
</html>
